<header class="nav" [class.scrolled]="scrolled()">
  <div class="wrap nav-in">

    <!-- Brand -->
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <img class="brand-logo" src="assets/images/logo.png" alt="Mano Madhu Tours and Travels" width="636" height="638" />
    </a>

    <!-- Desktop links (mobile drawer markup lives outside <header>, see below,
         to avoid the header's backdrop-filter creating a containing block that
         would clip a position:fixed drawer to the header's own height) -->
    <nav class="nav-links nav-links-desktop">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: link.path === '/' }"
           (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <!-- Right CTAs -->
    <div class="nav-cta">
      <a [href]="'tel:+91' + business.phone" class="nav-call">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 5 12.84 19.79 19.79 0 0 1 1.93 4.16 2 2 0 0 1 3.89 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>{{ business.phoneDisplay }}</span>
      </a>
      <a [href]="'https://wa.me/' + business.whatsapp + '?text=Hi%20Mano%20Madhu%20Tours%2C%20I%20want%20to%20book%20a%20trip.'"
         target="_blank" class="btn btn-wa btn-sm">Book on WhatsApp</a>
      <button class="burger" (click)="toggleMenu()" aria-label="Toggle menu">
        @if (menuOpen()) {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        }
      </button>
    </div>

  </div>
</header>

<!-- Mobile slide-in drawer (kept outside <header> — see comment above) -->
<div class="nav-backdrop" [class.open]="menuOpen()" (click)="closeMenu()"></div>
<nav class="nav-drawer" [class.open]="menuOpen()">
  <div class="drawer-head">
    <span class="drawer-title">Menu</span>
    <button class="drawer-close" (click)="closeMenu()" aria-label="Close menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  @for (link of navLinks; track link.path) {
    <a [routerLink]="link.path" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: link.path === '/' }"
       (click)="closeMenu()">{{ link.label }}</a>
  }
  <div class="drawer-foot">
    <a [href]="'tel:+91' + business.phone" class="drawer-call">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 5 12.84 19.79 19.79 0 0 1 1.93 4.16 2 2 0 0 1 3.89 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      {{ business.phoneDisplay }}
    </a>
  </div>
</nav>
